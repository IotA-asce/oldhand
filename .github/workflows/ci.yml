name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Supported platforms. A failure here blocks the merge and the release.
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r tools/lore/requirements.txt

      - name: Verify repository
        run: python -B tools/verify.py

  # Windows is NOT a supported platform yet. This job runs the same suite so
  # the gap stays measured and visible, but it must not gate anything until
  # the remaining defects are fixed and Windows support is actually claimed.
  # Known outstanding: `show --json` returns no stdout under the e2e harness.
  windows-preview:
    name: windows-preview / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r tools/lore/requirements.txt

      - name: Verify repository (informational only)
        run: python -B tools/verify.py
