name: Publish to PyPI

# Runs when a release is published. Uses PyPI Trusted Publishing (OIDC), so
# there is no API token to create, store, rotate, or leak.
#
# One-time setup on PyPI, before the first run:
#   https://pypi.org/manage/account/publishing/
#   Project name:      oldhand
#   Owner:             IotA-asce
#   Repository:        oldhand
#   Workflow filename: publish.yml
#   Environment:       pypi
#
# Then create a GitHub environment named `pypi` on this repository. Adding a
# required reviewer to it means every publish waits for a human approval.

on:
  release:
    # `published` alone is not enough: creating a pre-release emits
    # `prereleased`, so a beta cut with `gh release create --prerelease`
    # fires nothing and the upload silently never happens. `released` covers
    # a pre-release later promoted to a full release.
    types: [published, prereleased, released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel installs and runs before publishing
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install dist/*.whl
          /tmp/check/bin/oldhand --version
          /tmp/check/bin/oldhand init /tmp/check-archive
          /tmp/check/bin/oldhand --root /tmp/check-archive stats

      - name: Record checksums
        run: shasum -a 256 dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
