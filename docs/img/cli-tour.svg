<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-labelledby="title desc">
<title id="title">Lore command-line interface from intent to canonical record</title>
<desc id="desc">A human or coding agent searches or lists records, receives terminal summaries or JSON, shows one result, and reads the canonical Markdown archive.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="919" height="209" rx="12" fill="#0d1117" stroke="#21262d"/>
<text x="28" y="34" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650">One interface, two audiences</text>
<text x="28" y="55" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Readable terminal output for people; stable JSON documents for agents and scripts.</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
<rect x="28" y="90" width="142" height="70" rx="35" fill="#161b22" stroke="#bc8cff"/><text x="99" y="121" fill="#e6edf3" font-size="13" font-weight="600">Human or agent</text><text x="99" y="141" fill="#8b949e" font-size="11">one local CLI</text>
<rect x="208" y="90" width="150" height="70" rx="9" fill="#161b22" stroke="#58a6ff"/><text x="283" y="117" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="12">search · list</text><text x="283" y="141" fill="#8b949e" font-size="11">filters + limits</text>
<rect x="396" y="90" width="150" height="70" rx="9" fill="#161b22" stroke="#39c5cf"/><text x="471" y="117" fill="#e6edf3" font-size="12" font-weight="600">Summaries or JSON</text><text x="471" y="141" fill="#8b949e" font-size="11">small retrieval surface</text>
<rect x="584" y="90" width="142" height="70" rx="9" fill="#161b22" stroke="#d29922"/><text x="655" y="117" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="12">show &lt;id&gt;</text><text x="655" y="141" fill="#8b949e" font-size="11">open selectively</text>
<path d="M764 90H876V151Q820 174 764 151Z" fill="#161b22" stroke="#3fb950"/><text x="820" y="119" fill="#e6edf3" font-size="12" font-weight="600">Markdown</text><text x="820" y="140" fill="#8b949e" font-size="11">canonical archive</text>
</g>
<g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"><path d="M170 125H198"/><path d="M358 125H386"/><path d="M546 125H574"/><path d="M726 125H754"/></g>
<g font-family="ui-monospace,monospace" font-size="10" fill="#6e7681" text-anchor="middle"><text x="283" y="181">--type · --topic · --collection</text><text x="471" y="181">--json</text><text x="655" y="181">raw or --json</text></g>
</svg>
