<svg xmlns="http://www.w3.org/2000/svg" width="920" height="290" viewBox="0 0 920 290" role="img" aria-labelledby="title desc">
<title id="title">The complete Lore record lifecycle</title>
<desc id="desc">Discover archive vocabulary, retrieve existing knowledge, create new records, connect related records, retire stale records, then validate and measure the archive before repeating.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="919" height="289" rx="12" fill="#0d1117" stroke="#21262d"/>
<text x="28" y="34" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650">From a folder of notes to a maintained knowledge lifecycle</text>
<text x="28" y="55" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Every mutation validates canonical Markdown, publishes with rollback protection, then rebuilds the derived index.</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
<rect x="28" y="88" width="144" height="72" rx="9" fill="#161b22" stroke="#bc8cff"/><text x="100" y="116" fill="#e6edf3" font-size="13" font-weight="600">1 · Discover</text><text x="100" y="139" fill="#8b949e" font-size="10.5">collections · topics · list</text>
<rect x="208" y="88" width="144" height="72" rx="9" fill="#161b22" stroke="#58a6ff"/><text x="280" y="116" fill="#e6edf3" font-size="13" font-weight="600">2 · Retrieve</text><text x="280" y="139" fill="#8b949e" font-size="10.5">search · show · JSON</text>
<rect x="388" y="88" width="144" height="72" rx="9" fill="#161b22" stroke="#39c5cf"/><text x="460" y="116" fill="#e6edf3" font-size="13" font-weight="600">3 · Create</text><text x="460" y="139" fill="#8b949e" font-size="10.5">new · dry-run · JSON</text>
<rect x="568" y="88" width="144" height="72" rx="9" fill="#161b22" stroke="#d29922"/><text x="640" y="116" fill="#e6edf3" font-size="13" font-weight="600">4 · Connect</text><text x="640" y="139" fill="#8b949e" font-size="10.5">relate · unrelate</text>
<rect x="748" y="88" width="144" height="72" rx="9" fill="#161b22" stroke="#f85149"/><text x="820" y="116" fill="#e6edf3" font-size="13" font-weight="600">5 · Retire</text><text x="820" y="139" fill="#8b949e" font-size="10.5">status · supersede</text>
<rect x="388" y="202" width="144" height="62" rx="31" fill="#161b22" stroke="#3fb950"/><text x="460" y="227" fill="#e6edf3" font-size="12.5" font-weight="600">Validate &amp; measure</text><text x="460" y="248" fill="#8b949e" font-size="10.5">doctor · conflicts · metrics</text>
</g>
<g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"><path d="M172 124H198"/><path d="M352 124H378"/><path d="M532 124H558"/><path d="M712 124H738"/><path d="M820 160V184H532V212"/></g>
<path d="M388 233H100V170" fill="none" stroke="#6e7681" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="230" y="225" fill="#6e7681" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">repeat with a healthier archive</text>
</svg>
