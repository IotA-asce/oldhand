<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Lore discovery replay loop</title>
<desc id="desc">A live discovery task becomes an immutable experience trace. Lore replays that history under candidate policies, compares results under budgets and holdouts, and lets a human distill the useful outcome into durable Markdown memory.</desc>
<defs>
  <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#bc8cff" stop-opacity=".13"/><stop offset="1" stop-color="#39c5cf" stop-opacity=".08"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="359" rx="14" fill="#0d1117" stroke="#21262d"/>
<rect x="22" y="22" width="956" height="316" rx="12" fill="url(#glow)"/>
<text x="42" y="56" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650">Turn yesterday’s search into tomorrow’s advantage</text>
<text x="42" y="79" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5">The trace is evidence. Replay is analysis. Distillation remains a human decision.</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
  <rect x="42" y="115" width="170" height="76" rx="10" fill="#161b22" stroke="#bc8cff"/>
  <text x="127" y="143" fill="#e6edf3" font-size="13.5" font-weight="650">Live discovery</text>
  <text x="127" y="166" fill="#8b949e" font-size="11">task + fixed evaluator</text>
  <rect x="272" y="115" width="190" height="76" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="367" y="143" fill="#e6edf3" font-size="13.5" font-weight="650">Experience trace</text>
  <text x="367" y="166" fill="#8b949e" font-size="11">proposals + grounded results</text>
  <rect x="522" y="115" width="200" height="76" rx="10" fill="#161b22" stroke="#39c5cf"/>
  <text x="622" y="143" fill="#e6edf3" font-size="13.5" font-weight="650">Offline replay</text>
  <text x="622" y="166" fill="#8b949e" font-size="11">breadth · depth · score-greedy</text>
  <rect x="782" y="115" width="176" height="76" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="870" y="143" fill="#e6edf3" font-size="13.5" font-weight="650">Policy evidence</text>
  <text x="870" y="166" fill="#8b949e" font-size="11">budget · cost · holdout</text>
  <rect x="390" y="250" width="220" height="66" rx="33" fill="#161b22" stroke="#3fb950"/>
  <text x="500" y="277" fill="#e6edf3" font-size="13" font-weight="650">Human-reviewed distillation</text>
  <text x="500" y="298" fill="#8b949e" font-size="11">durable Markdown memory</text>
</g>
<g stroke="#8b949e" stroke-width="1.7" fill="none">
  <path d="M212 153H258"/><path d="M462 153H508"/><path d="M722 153H768"/><path d="M870 191V220H610V259"/>
</g>
<g fill="#8b949e"><rect x="212" y="152" width="46" height="2"/><rect x="462" y="152" width="46" height="2"/><rect x="722" y="152" width="46" height="2"/><rect x="869" y="191" width="2" height="30"/><rect x="610" y="219" width="261" height="2"/><rect x="609" y="220" width="2" height="39"/></g>
<g fill="#8b949e"><path d="M262 153l-8-5v10z"/><path d="M512 153l-8-5v10z"/><path d="M772 153l-8-5v10z"/><path d="M610 263l-5-8h10z"/></g>
<path d="M390 283H127V205" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="5 4"/>
<g fill="#6e7681"><rect x="127" y="282" width="263" height="2"/><rect x="126" y="205" width="2" height="78"/></g>
<path d="M127 201l-5 8h10z" fill="#6e7681"/>
<text x="245" y="274" fill="#6e7681" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">the next task starts wiser</text>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" text-anchor="middle">
  <text x="242" y="137" fill="#6e7681">record</text><text x="492" y="137" fill="#6e7681">simulate</text><text x="752" y="137" fill="#6e7681">compare</text>
</g>
</svg>
