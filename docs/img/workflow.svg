<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-labelledby="title desc">
<title id="title">Lore's everyday memory loop</title>
<desc id="desc">Search before work, open only useful records, do the work, decide whether the result is durable, and write a record only when forgetting would be expensive.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="919" height="209" rx="12" fill="#0d1117" stroke="#21262d"/>
<text x="28" y="34" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650">The everyday loop</text>
<text x="28" y="55" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Retrieve cheaply. Read selectively. Write only what would be expensive to rediscover.</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
<rect x="28" y="89" width="144" height="72" rx="9" fill="#161b22" stroke="#58a6ff"/><text x="100" y="119" fill="#e6edf3" font-size="13" font-weight="600">1 · Search first</text><text x="100" y="141" fill="#8b949e" font-size="11">ranked summaries</text>
<rect x="208" y="89" width="144" height="72" rx="9" fill="#161b22" stroke="#bc8cff"/><text x="280" y="119" fill="#e6edf3" font-size="13" font-weight="600">2 · Open one</text><text x="280" y="141" fill="#8b949e" font-size="11">full Markdown</text>
<rect x="388" y="89" width="144" height="72" rx="9" fill="#161b22" stroke="#d29922"/><text x="460" y="119" fill="#e6edf3" font-size="13" font-weight="600">3 · Do the work</text><text x="460" y="141" fill="#8b949e" font-size="11">use current truth</text>
<path d="M640 82L719 125L640 168L561 125Z" fill="#161b22" stroke="#f85149"/><text x="640" y="119" fill="#e6edf3" font-size="12" font-weight="600">Worth</text><text x="640" y="136" fill="#e6edf3" font-size="12" font-weight="600">forgetting?</text>
<rect x="748" y="89" width="144" height="72" rx="9" fill="#161b22" stroke="#3fb950"/><text x="820" y="119" fill="#e6edf3" font-size="13" font-weight="600">4 · Write once</text><text x="820" y="141" fill="#8b949e" font-size="11">durable knowledge</text>
</g>
<g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"><path d="M172 125H198"/><path d="M352 125H378"/><path d="M532 125H554"/><path d="M719 125H738"/></g>
<text x="730" y="112" fill="#8b949e" font-family="ui-monospace,monospace" font-size="10">yes</text>
<path d="M640 168V183H460V168" fill="none" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="550" y="198" fill="#6e7681" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">no · let Git, tests or docs keep it</text>
</svg>
